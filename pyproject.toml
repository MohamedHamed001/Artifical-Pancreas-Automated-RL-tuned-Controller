[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-rl"
version = "0.1.0"
description = "Artificial Pancreas RL-tuned PID controller: Hovorka virtual patient + A2C PID tuner + Streamlit digital-twin demo."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohamed A. Hamed" }]
# Python 3.11 is the validated runtime for the stabilization phases.
requires-python = ">=3.11,<3.12"
keywords = [
    "reinforcement-learning",
    "diabetes",
    "type-1-diabetes",
    "hovorka",
    "pid",
    "a2c",
    "digital-twin",
    "artificial-pancreas",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "requests>=2.28",
    "gymnasium>=0.28",
]

[project.optional-dependencies]
rl = [
    "tensorflow>=2.10",
    "h5py>=3.8",
]
mpc = [
    "cvxpy>=1.4",
]
demo = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
dev = [
    "pytest>=7",
    "pytest-mock>=3.10",
]
fast = [
    "numba>=0.56",
]

[project.scripts]
ap-rl-download = "ap_rl.scripts.download_checkpoints:main"
ap-rl-train = "ap_rl.training.train_a2c:main"

[project.urls]
Homepage = "https://github.com/your-org/Artifical-Pancreas-Automated-RL-tuned-Controller"
Issues = "https://github.com/your-org/Artifical-Pancreas-Automated-RL-tuned-Controller/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["ap_rl*"]

[tool.setuptools.package-data]
"ap_rl" = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
